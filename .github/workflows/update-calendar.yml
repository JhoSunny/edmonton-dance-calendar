name: Refresh Edmonton dance events

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1,13 * * *'
  push:
    branches: [main]
    paths:
      - 'generate_calendar.py'
      - 'requirements.txt'
      - '.github/workflows/update-calendar.yml'

permissions:
  contents: write

concurrency:
  group: update-edmonton-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test calendar parser
        run: python -m unittest discover -s tests -v
      - name: Generate calendar
        run: python generate_calendar.py
      - name: Commit updated feed for GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edmonton.ics
          if ! git diff --cached --quiet; then
            git commit -m "Update Edmonton events feed"
            git push
          fi
